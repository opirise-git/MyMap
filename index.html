<!-- 개편된 새 목표 설정 모달 -->
    <div id="goalModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="absolute w-full h-full bg-gray-900 opacity-50" onclick="closeModal()"></div>
        <div class="bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-lg z-50 overflow-y-auto max-h-[90vh]">
            <div class="py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3 border-b border-gray-100 mb-4">
                    <p class="text-xl font-bold text-gray-800">새 목표 설정</p>
                    <div class="cursor-pointer z-50 text-gray-400 hover:text-gray-700 transition" onclick="closeModal()"><i class="fa-solid fa-xmark text-xl"></i></div>
                </div>
                
                <form id="newGoalForm" onsubmit="event.preventDefault(); saveNewGoal();">
                    <!-- 1. 목표 이름 -->
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-bold mb-2">어떤 목표를 달성하고 싶으신가요?</label>
                        <input type="text" id="goalTitle" placeholder="예: 매일 아침 조깅하기" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
                    </div>
                    
                    <!-- 2. 목표 기간 (1주~4주, 1달~6달 규격화 버튼) -->
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">목표 기간</label>
                        
                        <!-- 주 단위 그룹 -->
                        <div class="text-xs text-gray-400 mb-1.5 font-medium">주 단위</div>
                        <div class="flex flex-wrap gap-2 mb-3" id="durationWeeks">
                            <button type="button" onclick="selectDuration(7, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">1주</button>
                            <button type="button" onclick="selectDuration(14, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">2주</button>
                            <button type="button" onclick="selectDuration(21, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">3주</button>
                            <button type="button" onclick="selectDuration(28, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">4주</button>
                        </div>

                        <!-- 월 단위 그룹 -->
                        <div class="text-xs text-gray-400 mb-1.5 font-medium">월 단위</div>
                        <div class="flex flex-wrap gap-2" id="durationMonths">
                            <button type="button" onclick="selectDuration(30, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">1달</button>
                            <button type="button" onclick="selectDuration(60, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">2달</button>
                            <button type="button" onclick="selectDuration(90, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">3달</button>
                            <button type="button" onclick="selectDuration(120, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">4달</button>
                            <button type="button" onclick="selectDuration(150, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">5달</button>
                            <button type="button" onclick="selectDuration(180, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">6달</button>
                        </div>

                        <input type="hidden" id="selectedDays" value="" required>
                        <p id="durationError" class="text-red-500 text-xs mt-2 hidden">기간을 선택해주세요.</p>
                    </div>

                    <div class="flex justify-end pt-2 space-x-2">
                        <button type="button" class="px-4 bg-white p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition" onclick="closeModal()">취소</button>
                        <button type="submit" class="px-4 bg-blue-600 p-2 rounded-lg text-white hover:bg-blue-700 transition">목표 생성하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
