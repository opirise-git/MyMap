<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Roadmap Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
        .progress-bar-fill { transition: width 0.8s ease-out; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- [1] 네비게이션 바 -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fa-solid fa-map-location-dot text-blue-600 text-2xl mr-3"></i>
                    <span class="font-bold text-xl tracking-tight text-gray-900">My Life Roadmap</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- [2] 메인 대시보드 -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center">
                    안녕하세요, 가을님!
                    <img src="image_a085ee.png" alt="하트 프로필" class="w-10 h-10 ml-2 object-contain drop-shadow-sm">
                </h1>
                <p class="text-sm text-gray-500 mt-1">오늘도 목표를 향해 조금씩 나아가고 있어요.</p>
            </div>
            <button onclick="openNewGoalModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg shadow-sm transition-colors flex items-center">
                <i class="fa-solid fa-plus mr-2"></i> 새 목표 설정
            </button>
        </div>

        <!-- 현재 진행 중인 목표 영역 -->
        <div id="active-goals-wrapper">
            <h2 class="text-lg font-bold text-gray-800 border-b pb-2 mb-6">현재 진행 중인 목표</h2>
            <div id="goals-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 진행 중인 카드가 자동 주입됩니다 -->
            </div>
        </div>

        <!-- 완료한 목표 영역 (새로 추가됨) -->
        <div id="completed-goals-wrapper" class="mt-14 hidden">
            <h2 class="text-lg font-bold text-gray-500 border-b pb-2 mb-6 flex items-center">
                완료한 목표 <i class="fa-solid fa-medal ml-2 text-amber-400 text-xl"></i>
            </h2>
            <div id="completed-goals-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 opacity-75">
                <!-- 100% 이상 달성한 카드가 이곳으로 이동합니다 -->
            </div>
        </div>
    </main>

    <!-- [3] 새 목표 설정 모달 -->
    <div id="goalModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="absolute w-full h-full bg-gray-900 opacity-50" onclick="closeModal()"></div>
        <div class="bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-lg z-50 overflow-y-auto max-h-[90vh]">
            <div class="py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3 border-b border-gray-100 mb-4">
                    <p class="text-xl font-bold text-gray-800">새 목표 설정</p>
                    <div class="cursor-pointer z-50 text-gray-400 hover:text-gray-700 transition" onclick="closeModal()">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </div>
                </div>
                
                <form id="newGoalForm" onsubmit="event.preventDefault(); saveNewGoal();">
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-bold mb-2">어떤 목표를 달성하고 싶으신가요?</label>
                        <input type="text" id="goalTitle" placeholder="예: 매일 아침 조깅하기" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
                    </div>

                    <div class="mb-5 bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                        <label class="block text-gray-800 text-sm font-bold mb-3">진행 사항 업데이트 방식</label>
                        <div class="flex flex-col space-y-3">
                            <label class="flex items-start cursor-pointer">
                                <input type="radio" name="updateType" value="add" class="mt-0.5 mr-2" checked>
                                <div>
                                    <span class="text-sm font-medium text-gray-800 block">진척도 추가</span>
                                    <span class="text-xs text-gray-500 block">예) 독서: 기존 20%에 10%를 더해 30%로 만듦</span>
                                </div>
                            </label>
                            <label class="flex items-start cursor-pointer">
                                <input type="radio" name="updateType" value="set" class="mt-0.5 mr-2">
                                <div>
                                    <span class="text-sm font-medium text-gray-800 block">진척도 설정</span>
                                    <span class="text-xs text-gray-500 block">예) 몸무게: 입력한 값 자체가 현재 달성률(%)이 됨</span>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">목표 기간</label>
                        
                        <div class="text-xs text-gray-400 mb-1.5 font-medium">주 단위</div>
                        <div class="flex flex-wrap gap-2 mb-3" id="durationWeeks">
                            <button type="button" onclick="selectDuration(7, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">1주</button>
                            <button type="button" onclick="selectDuration(14, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">2주</button>
                            <button type="button" onclick="selectDuration(21, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">3주</button>
                            <button type="button" onclick="selectDuration(28, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">4주</button>
                        </div>

                        <div class="text-xs text-gray-400 mb-1.5 font-medium">월 단위</div>
                        <div class="flex flex-wrap gap-2" id="durationMonths">
                            <button type="button" onclick="selectDuration(30, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">1달</button>
                            <button type="button" onclick="selectDuration(60, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">2달</button>
                            <button type="button" onclick="selectDuration(90, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">3달</button>
                            <button type="button" onclick="selectDuration(120, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">4달</button>
                            <button type="button" onclick="selectDuration(150, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">5달</button>
                            <button type="button" onclick="selectDuration(180, this)" class="duration-btn border border-gray-300 text-gray-600 px-3 py-1.5 rounded-md text-sm hover:bg-gray-50">6달</button>
                        </div>

                        <input type="hidden" id="selectedDays" value="" required>
                        <p id="durationError" class="text-red-500 text-xs mt-2 hidden">기간을 선택해주세요.</p>
                    </div>

                    <div class="flex justify-end pt-2 space-x-2">
                        <button type="button" class="px-4 bg-white p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition" onclick="closeModal()">취소</button>
                        <button type="submit" class="px-4 bg-blue-600 p-2 rounded-lg text-white hover:bg-blue-700 transition">목표 생성하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- [4] 히스토리 보기 모달 -->
    <div id="historyModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="absolute w-full h-full bg-gray-900 opacity-50" onclick="closeHistoryModal()"></div>
        <div class="bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-lg z-50 flex flex-col max-h-[80vh]">
            <div class="py-4 px-6 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                <div>
                    <p class="text-sm text-gray-500 font-medium">진척도 기록</p>
                    <p id="historyGoalTitle" class="text-lg font-bold text-gray-800 mt-0.5">목표 이름</p>
                </div>
                <div class="cursor-pointer z-50 text-gray-400 hover:text-gray-700 transition p-2" onclick="closeHistoryModal()">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </div>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow">
                <ul id="historyList" class="space-y-1">
                    <!-- 자바스크립트를 통해 이곳에 히스토리가 꽂힙니다 -->
                </ul>
            </div>
        </div>
    </div>

    <script type="module" src="./firebase-logic.js"></script>
</body>
</html>
